<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>数学分析 · 讲义目录</title>
<style>
:root{color-scheme:light;--ink:#24313b;--muted:#66747b;--paper:#fbfaf6;--line:#dedfda;--blue:#35566b;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",serif}
main{max-width:900px;margin:0 auto;padding:clamp(35px,7vw,85px) 24px 90px}
header{padding-bottom:29px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.16em}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:600;letter-spacing:.07em;margin:12px 0 10px}
.subtitle{font-size:14px;color:var(--muted);line-height:1.9;margin:0}
h2{font-size:17px;font-weight:600;margin:37px 0 20px}
.list{display:grid;gap:12px}
.item{display:block;border:1px solid var(--line);background:#fff;padding:21px 23px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.item:hover{border-color:var(--blue);transform:translateY(-2px)}
.title{font-size:17px;line-height:1.5;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin-top:9px}
footer{border-top:1px solid var(--line);margin-top:60px;padding-top:20px;font-size:12px;color:var(--muted)}
footer a{color:var(--blue)}a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">MATHEMATICAL ANALYSIS</div><h1>数学分析 · 讲义目录</h1>
<p class="subtitle">个人数学分析学习资料汇总。每份讲义独立保存，文件名保持原样。</p></header>
<h2>全部讲义</h2>
<div class="list" id="list"><a class="item" href="./%E6%95%B0%E5%AD%A6%E5%88%86%E6%9E%90_%E5%AE%9A%E4%B9%89%E4%B8%8E%E6%9F%AF%E8%A5%BF_BC%E5%8F%8C%E6%A0%8F_%E5%85%A8LaTeX%E7%89%88.html"><div class="title">数学分析 · 定义与柯西（双栏全 LaTeX 版）</div><div class="meta">HTML 讲义 · 点击阅读</div></a></div>
<footer>源代码仓库：<a href="https://github.com/yuqingbingxian/MathematicalAnalysis" rel="noopener">MathematicalAnalysis</a></footer>
</main>
<script>
(function(){
const list=document.getElementById('list');
const name='index.html';
fetch('https://api.github.com/repos/yuqingbingxian/MathematicalAnalysis/contents/',{headers:{'Accept':'application/vnd.github+json'}})
.then(r=>{if(!r.ok)throw Error('API unavailable');return r.json()})
.then(files=>{
  if(!Array.isArray(files))return;
  const entries=files.filter(f=>f.type==='file'&&/\.html?$/i.test(f.name)&&f.name!==name).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
  if(!entries.length)return;
  list.replaceChildren();
  for(const f of entries){
    const link=document.createElement('a');link.className='item';link.href='./'+encodeURIComponent(f.name);
    const title=document.createElement('div');title.className='title';title.textContent=f.name.replace(/\.html?$/i,'').replaceAll('_',' · ');
    const meta=document.createElement('div');meta.className='meta';meta.textContent='HTML 讲义 · 点击阅读';
    link.append(title,meta);list.appendChild(link);
  }
}).catch(()=>{});
})();
</script>
</body>
</html>
